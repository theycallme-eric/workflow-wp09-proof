# Product-owned CI generated from the owner-approved repository-readiness contract.
name: Project verification

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  project-verification:
    name: project-verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify 1
        run: |
          npm test
